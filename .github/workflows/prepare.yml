# Privileged metadata-only promotion preparation.
name: Prepare version
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository
    uses: JulianKimmig/zotero-plugin-ci/.github/workflows/prepare.yml@da9bb46555565bea8d634c5f41f03866e33fffa7
    with:
      helper_repository: JulianKimmig/zotero-plugin-ci
      helper_commit: da9bb46555565bea8d634c5f41f03866e33fffa7
      pr_number: ${{ github.event.pull_request.number }}
    secrets:
      APP_ID: ${{ secrets.RELEASE_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
