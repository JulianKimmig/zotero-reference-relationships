# Validate plugin pull requests and develop pushes.
name: Validate
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  validate:
    uses: JulianKimmig/zotero-plugin-ci/.github/workflows/validate.yml@cdbe9c5dd6b91b1db83d243b87475c301380bb6d
    with:
      helper_repository: JulianKimmig/zotero-plugin-ci
      helper_commit: cdbe9c5dd6b91b1db83d243b87475c301380bb6d
