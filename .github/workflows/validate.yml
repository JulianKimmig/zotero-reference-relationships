# Validate plugin pull requests and develop pushes.
name: Validate
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  validate:
    uses: JulianKimmig/zotero-plugin-ci/.github/workflows/validate.yml@5317b2c43c136a8bfcfc90313992e45dd71c24aa
    with:
      helper_repository: JulianKimmig/zotero-plugin-ci
      helper_commit: 5317b2c43c136a8bfcfc90313992e45dd71c24aa
